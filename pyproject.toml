[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-state-simulation"
version = "0.1.0"
description = "A configuration-driven project for cat-state simulations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "lmfit>=1.3",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pyyaml>=6.0",
    "qutip>=5.3.1",
]

[project.scripts]
run = "run:main"

[tool.setuptools]
py-modules = ["build_summary", "fit_models", "plot_results", "plot_style", "run", "simulation", "utils"]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 170

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
