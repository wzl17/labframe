[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labframe"
version = "0.1.0"
description = "Initialize and run reproducible simulation and experiment projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
labframe = "labframe.cli:main"

[tool.setuptools.packages.find]
include = ["labframe*"]

[tool.setuptools.package-data]
labframe = [
    "project_template/**/*",
    "project_template/.gitignore",
    "project_template/runs/.gitkeep",
]

[tool.setuptools.exclude-package-data]
labframe = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[dependency-groups]
dev = [
    "lmfit>=1.3",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "qutip>=5.3",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
